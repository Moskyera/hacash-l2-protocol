<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Hacash L2 Thin Wallet</title>
  <style>
    body { font-family: system-ui,sans-serif; max-width: 520px; margin: 0 auto; padding: 1.25rem; background:#0b1220; color:#e8eef7; }
    label { display:block; font-size:.8rem; color:#8aa0bf; margin-top:.75rem; }
    input, textarea { width:100%; box-sizing:border-box; padding:.55rem .65rem; border-radius:8px; border:1px solid #243049; background:#151e30; color:#fff; }
    button { margin-top:1rem; width:100%; padding:.7rem; border:0; border-radius:8px; background:#2b6cb0; color:#fff; font-weight:600; cursor:pointer; }
    pre { background:#101826; padding:.75rem; border-radius:8px; font-size:.75rem; overflow:auto; white-space:pre-wrap; }
    .hint { color:#8aa0bf; font-size:.85rem; }
  </style>
</head>
<body>
  <h1 style="font-size:1.2rem">L2 Thin Wallet</h1>
  <p class="hint">Reference UI for humans. Keys stay in your agent/SDK — this page only calls public hub APIs (no local signing yet).</p>
  <label>Hub base URL</label>
  <input id="hub" value=""/>
  <label>Your address (readable)</label>
  <input id="addr" placeholder="1…"/>
  <button onclick="findHubs()">Find hubs</button>
  <button onclick="me()">My snapshot</button>
  <label>Pay to</label>
  <input id="to" placeholder="1Payee…"/>
  <label>Amount HAC (e.g. 1:247)</label>
  <input id="amt" value="1:247"/>
  <button onclick="pay()">Create payment (unsigned)</button>
  <pre id="out">Ready.</pre>
  <script>
    document.getElementById('hub').value = location.origin;
    const out = (x) => document.getElementById('out').textContent =
      typeof x === 'string' ? x : JSON.stringify(x, null, 2);
    const base = () => document.getElementById('hub').value.replace(/\/$/,'');
    async function findHubs() {
      const j = await fetch(base() + '/v1/wallet/start').then(r=>r.json());
      out(j);
    }
    async function me() {
      const a = document.getElementById('addr').value.trim();
      const j = await fetch(base() + '/v1/wallet/me?address=' + encodeURIComponent(a)).then(r=>r.json());
      out(j);
    }
    async function pay() {
      const body = {
        from: document.getElementById('addr').value.trim(),
        to: document.getElementById('to').value.trim(),
        amount_hac: document.getElementById('amt').value.trim(),
        local_only: true,
      };
      const j = await fetch(base() + '/v1/wallet/pay', {
        method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)
      }).then(r=>r.json());
      out(j);
    }
  </script>
</body>
</html>
