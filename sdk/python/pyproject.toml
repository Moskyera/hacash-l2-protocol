[project]
name = "hacash-agent-pay"
version = "0.2.3"
description = "Hacash Agent Pay SDK for L2 payments for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "ecdsa>=0.19.0",
  "base58>=2.1.1",
  "pycryptodome>=3.23.0,<4",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hacash_agent_pay*"]
