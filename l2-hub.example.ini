; Example env-style notes for hacash-l2-hub (CLI flags also work).
; Production global mesh: identity + API token + HTTPS + seeds. See NETWORK-GLOBAL.md

; HACASH_L2_BIND=0.0.0.0:9090
; HACASH_L2_PUBLIC_URL=https://hub.example.com
; HACASH_L2_FULLNODE=127.0.0.1:8080
; HACASH_L2_FULLNODE_TOKEN=
; HACASH_L2_PROVIDER_ID=MyHub
; HACASH_L2_NAME=my-public-hub
; HACASH_L2_BOOTSTRAP=https://seed1.example,https://seed2.example
; HACASH_L2_SEEDS_URL=https://community.example/seeds.json
; HACASH_L2_SEEDS_PATH=./seeds.example.json
; HACASH_L2_API_TOKEN=change-me-long-random
; HACASH_L2_IDENTITY_PASSWORD=change-me-hub-identity-passphrase
; HACASH_L2_IDENTITY_SECRET_HEX=
; HACASH_L2_ALLOW_PRIVATE_PEERS=false
; HACASH_L2_PAYMENT_TTL_SECS=3600
; HACASH_L2_STATE_PATH=./data/hub-state.json
; HACASH_L2_GOSSIP_SECS=30
; HACASH_L2_WATCH_SECS=60
; HACASH_L2_ANNOUNCE_ON_START=true
; HACASH_L2_REQUIRE_VALID_HELLO_SIG=true
; HACASH_L2_HELLO_MAX_AGE_SECS=600
; HACASH_L2_REGION=eu
; HACASH_L2_CONTACT=https://example.com/ops
; HACASH_L2_FEE_BASE_MEI=0
; HACASH_L2_FEE_PPM=1000
; HACASH_L2_PUBLIC=true

; Local two-hub lab (private URLs allowed):
; hacash-l2-hub --bind 127.0.0.1:9090 --provider-id HubA --state-path ./data/hub-a.json --allow-private-peers --identity-password lab-a
; hacash-l2-hub --bind 127.0.0.1:9091 --provider-id HubB --state-path ./data/hub-b.json --bootstrap http://127.0.0.1:9090 --allow-private-peers --identity-password lab-b
